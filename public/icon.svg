<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F9B97"/>
      <stop offset="100%" stop-color="#1D6360"/>
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28968"/>
      <stop offset="100%" stop-color="#B86544"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="120" fill="#12181A"/>
  
  <!-- Interlocking Duo Rings -->
  <g transform="translate(0, 0)">
    <!-- Equal Left Ring (Deep Teal) -->
    <circle cx="206" cy="256" r="105" fill="none" stroke="url(#tealGrad)" stroke-width="42" stroke-linecap="round"/>
    <!-- Equal Right Ring (Terracotta) -->
    <circle cx="306" cy="256" r="105" fill="none" stroke="url(#terraGrad)" stroke-width="42" stroke-linecap="round"/>
    
    <!-- Partner Central Cores -->
    <circle cx="206" cy="256" r="24" fill="#2F9B97"/>
    <circle cx="306" cy="256" r="24" fill="#E28968"/>
    
    <!-- Central Shared Spark (Equal Balance Point) -->
    <path d="M 256 226 L 261 251 L 286 256 L 261 261 L 256 286 L 251 261 L 226 256 L 251 251 Z" fill="#F7F5F0" filter="url(#glow)"/>
  </g>
</svg>
